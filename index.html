<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIVEZONE — Sign in</title>
<meta name="theme-color" content="#12151B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<script>
  document.documentElement.setAttribute("data-theme", localStorage.getItem("fz_theme") || "dark");
</script>
</head>
<body>
  <div class="centered-shell">
    <div class="login-card">
      <div class="eyebrow">Gate 05 · Boarding</div>
      <h1>FIVE<span>ZONE</span></h1>
      <p class="sub">One board, five cities, zero timezone math. Sign in to see everyone.</p>

      <form id="login-form">
        <label for="who">Who's this</label>
        <select id="who" required>
          <option value="" disabled selected>Select your name…</option>
        </select>

        <label for="passcode">Your PIN</label>
        <input type="password" id="passcode" placeholder="Your Your PIN" autocomplete="off" required />
        <p class="hint" id="auth-hint"></p>

        <div class="error-msg" id="err"></div>
        <button type="submit">Board the flight →</button>
      </form>

      <button class="ghost theme-toggle-login" type="button" data-theme-btn>☾ Daylight mode</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
