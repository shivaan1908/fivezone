<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIVEZONE — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="centered-shell">
    <div class="login-card">
      <div class="eyebrow">Gate 05 · Boarding</div>
      <h1>FIVE<span>ZONE</span></h1>
      <p class="sub">One board, five cities, zero timezone math. Sign in to see everyone.</p>
      <form id="login-form">
        <label for="who">Who's this</label>
        <select id="who" required><option value="" disabled selected>Select your name…</option></select>
        <label for="passcode">Your PIN</label>
        <input type="password" id="passcode" placeholder="Enter your PIN" autocomplete="off" required />
        <p class="hint" id="auth-hint"></p>
        <div class="error-msg" id="err"></div>
        <button type="submit">Board the flight →</button>
      </form>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
